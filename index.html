<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกและประเมินภาวะโภชนาการนักเรียน (งานอนามัย)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { font-family: 'Sarabun', sans-serif; }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<!-- ... (ส่วน HEADER และ โครงสร้าง HTML เหมือนเดิมทุกประการ) ... -->

  <!-- ==================== JAVASCRIPT ==================== -->
  <script>
    // 🔴 🔴 เปลี่ยน URL ตรงนี้เป็น URL เว็บแอปที่ได้จากการ Deploy ใหม่ของคุณครู 🔴 🔴
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzyIsnbrW0f_umjKqAUZuPNciqK_cyDRznRn6qloPDqOX9uTrckHFd08Eci6H7s6m_WFg/exec"; 

    var currentStudents = [];
    var currentSheet = '';

    // ฟังก์ชันโหลดข้อมูลห้องเรียน (เปลี่ยนมาใช้ Fetch API แทน google.script.run)
    function loadStudentData() {
      var val = document.getElementById('classSelector').value;
      if (!val) {
        document.getElementById('classroomInfoBox').classList.add('hidden');
        document.getElementById('studentTableBody').innerHTML = '<tr><td colspan="8" class="text-center py-16 text-slate-400">👆 กรุณาเลือกห้องเรียนด้านบน เพื่อเริ่มกรอกข้อมูล</td></tr>';
        return;
      }

      var parts = val.split('|');
      currentSheet = parts[0];
      var sectionIndex = parseInt(parts[1], 10);

      Swal.fire({
        title: 'กำลังดึงข้อมูล...',
        text: 'กรุณารอสักครู่ กำลังเตรียมรายชื่อนักเรียน',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      // ใช้ Fetch เรียก API แทน
      fetch(`${GAS_API_URL}?action=getStudents&sheetName=${encodeURIComponent(currentSheet)}&sectionIndex=${sectionIndex}`)
        .then(response => response.json())
        .then(res => {
          Swal.close();
          if (res.success) {
            currentStudents = res.list;
            document.getElementById('classroomInfoText').innerText = res.teacherInfo;
            document.getElementById('classroomInfoBox').classList.remove('hidden');
            renderTable();
          } else {
            Swal.fire('แจ้งเตือน', res.message, 'warning');
          }
        })
        .catch(error => {
          Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้: ' + error.message, 'error');
        });
    }

    // ... (ส่วน renderTable, handleInput, evaluateHealthFemale, getBadge เหมือนเดิม) ...

    // สั่งบันทึกลง Google Sheet (เปลี่ยนมาใช้ Fetch POST)
    function saveData() {
      if (!currentSheet || currentStudents.length === 0) {
        Swal.fire('แจ้งเตือน', 'กรุณาเลือกห้องเรียนก่อนทำการบันทึก', 'warning');
        return;
      }

      Swal.fire({
        title: 'ยืนยันการบันทึก?',
        text: 'ระบบจะนำข้อมูลน้ำหนัก ส่วนสูง และการแปลผลเทอม 2 บันทึกลง Sheet',
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#059669',
        cancelButtonColor: '#64748b',
        confirmButtonText: 'บันทึกทันที',
        cancelButtonText: 'ยกเลิก'
      }).then((result) => {
        if (result.isConfirmed) {
          Swal.fire({
            title: 'กำลังบันทึกข้อมูล...',
            text: 'กรุณารอสักครู่ อย่าเพิ่งปิดหน้าต่างนี้',
            allowOutsideClick: false,
            didOpen: () => { Swal.showLoading(); }
          });

          // ส่งข้อมูลเป็น JSON ผ่าน POST Request
          fetch(GAS_API_URL, {
            method: 'POST',
            body: JSON.stringify({
              action: 'saveData',
              sheetName: currentSheet,
              updates: currentStudents
            }),
            headers: {
              'Content-Type': 'text/plain;charset=utf-8', 
            }
          })
          .then(response => response.json())
          .then(res => {
            if (res.success) {
              Swal.fire('บันทึกสำเร็จ!', 'บันทึกข้อมูลเทอม 2 ลง Google Sheet เรียบร้อยแล้ว (' + res.count + ' รายการ)', 'success');
            } else {
              Swal.fire('แจ้งเตือน', res.message, 'warning');
            }
          })
          .catch(error => {
            Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเพื่อบันทึกข้อมูลได้', 'error');
          });
        }
      });
    }
  </script>
</body>
</html>
